[package]
name = "clipflow"
version = "0.1.0"
edition = "2024"

[dependencies]
arboard = "3.7.0"
chrono = "0.4.45"
dirs = "7.0.0"
eframe = "0.37.0"
image = "0.25.10"
memmap2 = "0.9"
rfd = "0.15"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
ureq = "2"
winit = "0.30"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.5.3"
objc2-app-kit = { version = "0.2.2", features = [
    "NSApplication",
    "NSImage",
    "NSMenu",
    "NSMenuItem",
    "NSResponder",
    "NSStatusBar",
    "NSStatusItem",
] }
objc2-foundation = { version = "0.2.2", features = [
    "NSData",
    "NSDate",
    "NSObject",
    "NSTimer",
    "NSString",
    "NSThread",
] }
